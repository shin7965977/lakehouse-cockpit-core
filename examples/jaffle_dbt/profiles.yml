jaffle_neon:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('NEON_HOST') }}"
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('NEON_DB', 'neondb') }}"
      schema: dbt_dev
      sslmode: require
      threads: 4

elementary:
  outputs:
    default:
      type: postgres
      host: "{{ env_var('NEON_HOST') }}"
      user: "{{ env_var('NEON_USER') }}"
      password: "{{ env_var('NEON_PASSWORD') }}"
      port: 5432
      dbname: "{{ env_var('NEON_DB', 'neondb') }}"
      schema: dbt_dev_elementary
      sslmode: require
      threads: 4
