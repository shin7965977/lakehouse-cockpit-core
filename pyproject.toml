[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-cockpit-core"
version = "0.1.0"
description = "Microkernel Lakehouse Cockpit Framework for Streamlit & FastMCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "duckdb>=0.9.0",
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[tool.setuptools]
py-modules = ["adapter", "engine", "styles"]

[tool.setuptools.packages.find]
include = ["api*", "components*", "integrations*", "reports*", "services*"]
exclude = ["tests*", "examples*"]
